# SPDX-License-Identifier: AGPL-3.0-only

name: Tests and build

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARTER_PROVIDER: mock
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run offline tests with coverage
        run: >-
          python -m pytest
          -m "not local_model and not cloud_provider"
          --cov=src
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml
      - name: Verify reproducible evidence
        run: python -m examples.evidence.run_case --check
      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-python-3.12
          path: coverage.xml
          if-no-files-found: error

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install and import wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -c "from carter.web import create_app; assert create_app().test_client().get('/health').status_code == 200"
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  windows-installed-wheel:
    name: Windows installed-wheel smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Build wheel
        shell: pwsh
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist
      - name: Run isolated installed-wheel smoke without IANA data
        shell: pwsh
        run: |
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          $env:PYTHONTZPATH = ""
          python -m venv .wheel-smoke-venv
          $python = Join-Path $PWD ".wheel-smoke-venv\Scripts\python.exe"
          & $python -m pip install --upgrade pip
          $wheel = Get-ChildItem "dist\*.whl"
          if ($wheel.Count -ne 1) {
            throw "Expected exactly one wheel, found $($wheel.Count)."
          }
          & $python -m pip install $wheel.FullName
          & $python -m pip check
          & $python scripts\verify_installed_wheel.py --checkout-root $PWD
